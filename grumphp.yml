parameters:
    git_hook_variables:
      EXEC_GRUMPHP_COMMAND: docker compose run --no-TTY php
      ENV: {}
    tasks:
      git_blacklist:
        keywords:
          - "\\sdie("
          - "\\svar_dump("
          - "\\sexit;"
          - "\\sdd("
          - "\\sdump("
          - "@include hyphens"
          - "@include content-columns"
        triggered_by: ['php','scss']
